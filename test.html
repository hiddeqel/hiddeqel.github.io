<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CSS Sidebar</title>

<style>
    body{
        margin:0;
        font-family:sans-serif;
    }

    /* Скрываем checkbox */
    #menu-toggle{
        display:none;
    }

    /* Кнопка-бургер */
    .burger{
        position:fixed;
        top:20px;
        left:20px;
        font-size:30px;
        cursor:pointer;
        z-index:1001;
        user-select:none;
    }

    /* Боковая панель */
    .sidebar{
        position:fixed;
        top:0;
        left:-260px;
        width:250px;
        height:100vh;
        background:#222;
        color:white;
        padding:20px;
        box-sizing:border-box;

        transition:left 0.3s ease;
    }

    /* Когда checkbox отмечен — показываем меню */
    #menu-toggle:checked ~ .sidebar{
        left:0;
    }

    .sidebar h2{
        margin-top:60px;
    }

    .sidebar a{
        display:block;
        color:white;
        text-decoration:none;
        margin:15px 0;
    }
</style>
</head>
<body>

<input type="checkbox" id="menu-toggle">

<label for="menu-toggle" class="burger">
    ☰
</label>

<div class="sidebar">
    <h2>Меню</h2>

    <a href="#">Главная</a>
    <a href="#">Новости</a>
    <a href="#">Контакты</a>
</div>

</body>
</html>
